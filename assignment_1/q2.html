<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Question 2</title>
    <link rel="stylesheet" href="assignment.css" />
  </head>
  <body>
    <div class="content">
      <form action="q3.html" method="get">
        <h2>Genghis Khan History Quiz</h2>

        <div>
          <h3>2. Why is Genghis Khan's legacy considered controversial?</h3>
          <label
            ><input type="radio" name="q2" required /> A. He never fought any
            wars</label
          ><br />
          <label
            ><input type="radio" name="q2" /> B. His conquests involved
            large-scale violence and destruction</label
          ><br />
          <label
            ><input type="radio" name="q2" /> C. He ruled only one small
            city</label
          ><br />
          <label
            ><input type="radio" name="q2" /> D. He avoided political
            expansion</label
          >
        </div>

        <button class="btn2" type="submit">Submit</button>
      </form>
    </div>

    <script>
      document.addEventListener("keydown", function (event) {
        console.log("keydown:", event.key);
      });

      document.addEventListener("keyup", function (event) {
        console.log("keyup:", event.key);
      });

      document
        .querySelectorAll('input[type="radio"]')
        .forEach(function (radio) {
          radio.addEventListener("change", function () {
            document.querySelectorAll("label").forEach(function (label) {
              label.classList.remove("selected-option");
            });

            this.parentNode.classList.add("selected-option");
          });
        });
    </script>
  </body>
</html>
