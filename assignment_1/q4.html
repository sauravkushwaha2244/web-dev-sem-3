<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Question 4</title>
    <link rel="stylesheet" href="assignment.css" />
  </head>
  <body>
    <div class="content">
      <form action="q5.html" method="get">
        <h2>Genghis Khan History Quiz</h2>

        <div>
          <h3>4. Which was one of the effects of Mongol conquests?</h3>
          <label
            ><input type="radio" name="q4" required /> A. Destruction of some
            cities and large population losses</label
          ><br />
          <label
            ><input type="radio" name="q4" /> B. Complete end of international
            trade</label
          ><br />
          <label
            ><input type="radio" name="q4" /> C. Abolition of all
            religions</label
          ><br />
          <label
            ><input type="radio" name="q4" /> D. The disappearance of all Asian
            kingdoms</label
          >
        </div>

        <button class="btn4" type="submit">Submit</button>
      </form>
    </div>

    <script>
      document.addEventListener("keydown", function (event) {
        console.log("keydown:", event.key);
      });

      document.addEventListener("keyup", function (event) {
        console.log("keyup:", event.key);
      });

      document
        .querySelectorAll('input[type="radio"]')
        .forEach(function (radio) {
          radio.addEventListener("change", function () {
            document.querySelectorAll("label").forEach(function (label) {
              label.classList.remove("selected-option");
            });

            this.parentNode.classList.add("selected-option");
          });
        });
    </script>
  </body>
</html>
