    <div id="form">
      <h1 id="h1">keyboard events</h1>
      <p>onkeydown</p>
      <input
        type="text"
        onkeydown="
          document.getElementById('form').style.background = this.value
        "
      />
      <p>onkeyup</p>
      <input
        type="text"
        onkeyup="document.getElementById('form').style.background = this.value"
      />
      <p>onekeypress</p>
      <input
        type="text"
        onkeypress="
          document.getElementById('form').style.background = this.value
        "
      />
    </div>
  </body>
