<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Function</title>
    <script>
        function sum(a,b){
            return a+b;
        }
        function Diff(a,b){
            return Math.abs(a-b);
        }
        function Multiply(a,b){
            return a*b;
        }
        function Div(a,b){
            return a/b;
        }

        let sum1 =sum(4,6);
        let Diff1=Diff(4,6);
        let Multiply1=Multiply(4,6);
        let Div1=Div(4,6);
        document.write(sum1)<br>
        document.write(Diff1);
        document.write(Multiply1);
        document.write(Div1);

    </script>
</head>
<body>
    
</body>
</html>
