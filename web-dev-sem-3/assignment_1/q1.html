<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Question 1</title>
    <link rel="stylesheet" href="assignment.css" />
  </head>
  <body>
    <div class="content">
      <h2>Genghis Khan History Quiz</h2>

      <form action="q2.html" method="get">
        <div>
          <h3>1. Who was Genghis Khan?</h3>
          <label
            ><input type="radio" name="q1" value="A" required /> A. A Mongol
            ruler and military leader</label
          ><br />
          <label
            ><input type="radio" name="q1" value="B" /> B. A Roman
            emperor</label
          ><br />
          <label
            ><input type="radio" name="q1" value="C" /> C. A Chinese
            philosopher</label
          ><br />
          <label><input type="radio" name="q1" value="D" /> D. Batu</label>
        </div>

        <button class="btn1" type="submit">Submit</button>
      </form>
    </div>

    <script>
      document.addEventListener("keydown", function (event) {
        console.log("keydown:", event.key);
      });

      document.addEventListener("keyup", function (event) {
        console.log("keyup:", event.key);
      });

      document
        .querySelectorAll('input[type="radio"]')
        .forEach(function (radio) {
          radio.addEventListener("change", function () {
            document.querySelectorAll("label").forEach(function (label) {
              label.classList.remove("selected-option");
            });

            this.parentNode.classList.add("selected-option");
          });
        });
    </script>
  </body>
</html>
