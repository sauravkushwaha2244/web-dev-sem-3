<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Question 3</title>
    <link rel="stylesheet" href="assignment.css" />
  </head>
  <body>
    <div class="content">
      <form action="q4.html" method="get">
        <h2>Genghis Khan History Quiz</h2>

        <div>
          <h3>3. Which empire did Genghis Khan establish?</h3>
          <label
            ><input type="radio" name="q3" required /> A. Roman Empire</label
          ><br />
          <label><input type="radio" name="q3" /> B. Ottoman Empire</label
          ><br />
          <label><input type="radio" name="q3" /> C. Mongol Empire</label><br />
          <label><input type="radio" name="q3" /> D. Gupta Empire</label>
        </div>

        <button class="btn3" type="submit">Submit</button>
      </form>
    </div>

    <script>
      document.addEventListener("keydown", function (event) {
        console.log("keydown:", event.key);
      });

      document.addEventListener("keyup", function (event) {
        console.log("keyup:", event.key);
      });

      document
        .querySelectorAll('input[type="radio"]')
        .forEach(function (radio) {
          radio.addEventListener("change", function () {
            document.querySelectorAll("label").forEach(function (label) {
              label.classList.remove("selected-option");
            });

            this.parentNode.classList.add("selected-option");
          });
        });
    </script>
  </body>
</html>
